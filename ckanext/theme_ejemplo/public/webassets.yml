# Define el bundle para JavaScript
thematicbuilder-js:
  output: theme/thematicbuilder/javascript/thematicbuilder.js
  filters: rjsmin
  contents:
    - thematicbuilder/javascript/main.js

# Define el bundle para CSS
thematicbuilder-css:
  output: theme/thematicbuilder/css/thematicbuilder.css
  filters: cssrewrite,cssmin
  contents:
    - thematicbuilder/css/main.css

ckan-bs5-compat-js:
  output: theme/ckan-bs5-compat.js
  filters: rjsmin
  extra:
    preload:
      - vendor/bootstrap
  contents:
    - ckan-bs5-compat.js

theme-ejemplo-runtime-js:
  output: theme/theme-ejemplo-runtime.js
  filters: rjsmin
  contents:
    - theme_ejemplo_enhanced.js
    - topmenu-responsive.js
