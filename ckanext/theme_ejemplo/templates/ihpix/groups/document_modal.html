<div class="ixf-modal" id="ixg-document-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ixg-document-title"><div class="ixf-modal-dialog"><div class="ixf-modal-header"><h2 id="ixg-document-title" class="ixf-modal-title">{{ _('Upload an internal document') }}</h2><button class="ixf-modal-close" type="button" data-ihpix-modal-close aria-label="{{ _('Close') }}">×</button></div><form data-operation="group_document_save" enctype="multipart/form-data"{% if plan is defined %} data-plan-attachment{% endif %}>{{ m.group_hidden(group) }}{{ m.hidden('replaces_id','') }}<div class="ixf-modal-body">{{ m.field('title',_('Title')) }}<label>{{ _('Category') }}<select name="category">{% for cat in categories %}<option value="{{ cat }}">{{ m.state(cat) }}</option>{% endfor %}</select></label>{% if plan is defined %}{{ m.hidden('plan_id',plan.id) }}{% else %}<label>{{ _('Related activity') }}<select name="plan_id"><option value="">—</option>{% for p in group.plans %}<option value="{{ p.id }}">{{ p.payload.title }}</option>{% endfor %}</select></label>{% endif %}<p>{{ _('Private document, up to 20 MB. Earlier versions are kept.') }}</p><div data-ihpix-upload data-max-mb="20" data-accept=".pdf,.ppt,.pptx,.xls,.xlsx,.csv,.doc,.docx,.odt,.ods,.txt,.png,.jpg,.jpeg,.zip"><input type="file" name="file" required aria-label="{{ _('Choose a file to upload') }}"></div><div class="ixg-error" data-form-error role="alert"></div></div><div class="ixf-modal-footer"><button type="button" class="btn" data-ihpix-modal-close>{{ _('Cancel') }}</button><button class="btn btn-primary">{{ _('Upload and attach') }}</button></div></form></div></div>
