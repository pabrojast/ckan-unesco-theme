<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>DACS Logo Authorisation Platform</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>


<div class="photo" aria-hidden="true"></div>
<div class="app">
  <aside class="side glass" aria-label="Navigation">
    <div class="brand"><div class="lockup"><div class="logo-decade" role="img" aria-label="Decade of Action for Cryospheric Sciences 2025–2034"></div><i aria-hidden="true"></i><div class="logo-unesco" role="img" aria-label="UNESCO"></div></div><div class="brand-name"><b>Logo Authorisation Platform</b><span>Requests to use the logo of the Decade</span></div></div>
    <div id="bellBox"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="previewBox"></div>
      <div class="me" id="me"></div>
      <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12px">Secretariat: UNESCO-IHP</span><button class="btn sm" data-theme-btn type="button">Bright</button></div>
    </div>
  </aside>
  <main id="main">
    <div class="topbar glass"><div class="lockup"><div class="logo-decade" role="img" aria-label="Decade of Action for Cryospheric Sciences 2025–2034"></div><i aria-hidden="true"></i><div class="logo-unesco" role="img" aria-label="UNESCO"></div></div><div class="row" id="topMe"></div></div>
    <div class="compact-shell glass"><label class="compact-section">Logo section<select id="compactSection" aria-label="Logo section"></select></label><nav id="compactNav" aria-label="Logo sections"></nav><div id="compactTools"></div></div>
    <div id="view"><div class="glass card empty">Connecting to the register…</div></div>
  </main>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="Sections"></nav>
<div id="layer"></div>


</body>
</html>
