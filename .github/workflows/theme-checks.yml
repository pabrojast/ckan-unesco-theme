name: Theme checks

on:
  push:
    branches: [dev210]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-checks:
    name: Theme checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pure-test dependencies
        run: python -m pip install 'pytest>=8,<9' 'setuptools<81' 'openpyxl==3.1.5'
      - name: IHP-IX regression suite
        run: python -m pytest -q ckanext/theme_ejemplo/tests/test_ihpix_*.py
      - name: Official taxonomy snapshot
        run: python scripts/build_ihpix_taxonomy_data.py --check
      - name: Browser script syntax
        run: |
          node --check ckanext/theme_ejemplo/public/js/ihpix-report.js
          node --check ckanext/theme_ejemplo/public/js/ihpix-relations.js
          node --check ckanext/theme_ejemplo/public/js/ihpix-presentation.js
